<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
<title>Aqua — Terminal icon</title>
<defs>
  <clipPath id="clipTerm"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  <filter id="tileShadowTerm" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
  <filter id="glyphShadowTerm" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
  </filter>
  <linearGradient id="tileTerm" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#26262C"/>
    <stop offset="100%" stop-color="#0E0E10"/>
  </linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tileTerm)" filter="url(#tileShadowTerm)"/>
<rect x="16" y="16" width="480" height="240" rx="108" fill="url(#gloss)" clip-path="url(#clipTerm)"/>

<rect x="92" y="124" width="328" height="264" rx="40" fill="#000000" fill-opacity="0.35" stroke="#3A3A42" stroke-width="4"/>

<g filter="url(#glyphShadowTerm)">
  <polyline points="164,208 228,256 164,304" fill="none" stroke="#32D74B" stroke-width="32"
            stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="256" y="292" width="92" height="30" rx="15" fill="#32D74B"/>
</g>
</svg>
