    <stop offset="0%" stop-color="#0B6E86"/>
    <stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="gloss-finder" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
