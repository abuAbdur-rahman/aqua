<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
<title>Aqua — Spotlight icon</title>
<defs>
  <clipPath id="clipSp"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  <filter id="tileShadowSp" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
  <filter id="glyphShadowSp" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#083344" flood-opacity="0.55"/>
  </filter>
  <linearGradient id="tileSp" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3A3A42"/>
    <stop offset="100%" stop-color="#232328"/>
  </linearGradient>
  <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8CF0FF"/>
    <stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>
  <radialGradient id="glowSp" cx="46%" cy="42%" r="55%">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tileSp)" filter="url(#tileShadowSp)"/>
<rect x="16" y="16" width="480" height="240" rx="108" fill="url(#gloss)" clip-path="url(#clipSp)"/>

<circle cx="232" cy="224" r="160" fill="url(#glowSp)"/>

<g filter="url(#glyphShadowSp)">
  <circle cx="224" cy="216" r="88" fill="none" stroke="url(#glassGrad)" stroke-width="36"/>
  <line x1="292" y1="284" x2="380" y2="372" stroke="url(#glassGrad)" stroke-width="40" stroke-linecap="round"/>
</g>
<path d="M172 184 A68 68 0 0 1 236 136" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="12" stroke-linecap="round"/>
</svg>
