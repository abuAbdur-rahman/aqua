<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
<title>Aqua — settings icon</title>
<defs>
  <linearGradient id="g-settings" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#34343B"/>
    <stop offset="100%" stop-color="#54545F"/>
  </linearGradient>
  <linearGradient id="gloss-settings" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
    <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.10"/>
  </linearGradient>
  <filter id="shadow-settings" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.38"/>
  </filter>
</defs>

<g filter="url(#shadow-settings)">
  <rect x="26" y="26" width="460" height="460" rx="100" fill="url(#g-settings)"/>
  <rect x="26" y="26" width="460" height="460" rx="100" fill="url(#gloss-settings)"/>
  <rect x="26.5" y="26.5" width="459" height="459" rx="99.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</g>

<g>
  <rect x="242" y="140" width="28" height="48" rx="8" fill="#FFFFFF" transform="rotate(0 256 256)"/>
  <rect x="242" y="140" width="28" height="48" rx="8" fill="#FFFFFF" transform="rotate(45 256 256)"/>
  <rect x="242" y="140" width="28" height="48" rx="8" fill="#FFFFFF" transform="rotate(90 256 256)"/>
  <rect x="242" y="140" width="28" height="48" rx="8" fill="#FFFFFF" transform="rotate(135 256 256)"/>
  <rect x="242" y="140" width="28" height="48" rx="8" fill="#FFFFFF" transform="rotate(180 256 256)"/>
  <rect x="242" y="140" width="28" height="48" rx="8" fill="#FFFFFF" transform="rotate(225 256 256)"/>
  <rect x="242" y="140" width="28" height="48" rx="8" fill="#FFFFFF" transform="rotate(270 256 256)"/>
  <rect x="242" y="140" width="28" height="48" rx="8" fill="#FFFFFF" transform="rotate(315 256 256)"/>
  <circle cx="256" cy="256" r="74" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="34" fill="url(#g-settings)"/>
</g>
</svg>
