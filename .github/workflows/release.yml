name: Release

# Single release pipeline for version tags (v*). Two parallel builds attach
# to ONE GitHub Release:
#   1. windows job — tauri-action creates the draft release with the
#      installers (MSI + NSIS), updater signatures, and latest.json (the
#      app's Settings → Updates manifest).
#   2. daemon job — builds the static Linux musl tarball in parallel and
#      uploads it as a workflow artifact (the draft may not exist yet).
#   3. publish job — after both succeed, attaches the daemon tarball to the
#      draft and publishes the release as latest. No manual merging.
# Never depends on a local machine.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Build, sign, and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Aqua ${{ github.ref_name }}"
          releaseBody: "Installers: download the NSIS EXE (recommended) or the MSI. The NSIS build also carries the in-app updater signature. The WSL daemon tarball is attached below (see daemon/deploy/README.md)."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  daemon:
    name: Build daemon musl tarball
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: daemon
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools pkg-config
          sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/x86_64-linux-musl-gcc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: ${{ runner.os }}-daemon-musl-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-daemon-musl-

      - name: Build release (static musl)
        run: cargo build --release --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc

      - name: Create tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          OUT="aqua-daemon-${TAG}-linux-x86_64-musl.tar.gz"
          tar czf "../${OUT}" -C target/x86_64-unknown-linux-musl/release aqua-daemon aqua-daemon-helper
          ls -lh "../${OUT}"
          cd .. && sha256sum "${OUT}" | tee "${OUT}.sha256"

      # Upload as a workflow artifact rather than straight to the release:
      # the windows job creates the draft, and it may not exist yet when this
      # faster job finishes. The publish job does the attach.
      - name: Upload tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: daemon-tarball
          path: aqua-daemon-*.tar.gz*
          if-no-files-found: error

  publish:
    name: Attach daemon and publish
    needs: [windows, daemon]
    runs-on: ubuntu-latest
    steps:
      - name: Download daemon tarball
        uses: actions/download-artifact@v4
        with:
          name: daemon-tarball

      - name: Attach to release and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" aqua-daemon-*.tar.gz aqua-daemon-*.tar.gz.sha256
          gh release edit "$TAG" --draft=false --latest
