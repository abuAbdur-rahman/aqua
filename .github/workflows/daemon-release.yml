name: Daemon Release

# Publish a static Linux musl tarball for the WSL daemon when a version tag
# (v*) is pushed. Attaches to the same GitHub Release as the Windows MSI/NSIS
# from release.yml — no extra release created.
# Musl = static, no glibc floor (works on 20.04/22.04/24.04 WSL).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build daemon musl tarball
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: daemon
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools pkg-config
          sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/x86_64-linux-musl-gcc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: ${{ runner.os }}-daemon-musl-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-daemon-musl-

      - name: Build release (static musl)
        run: cargo build --release --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc

      - name: Create tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          OUT="aqua-daemon-${TAG}-linux-x86_64-musl.tar.gz"
          tar czf "../${OUT}" -C target/x86_64-unknown-linux-musl/release aqua-daemon aqua-daemon-helper
          ls -lh "../${OUT}"
          cd .. && sha256sum "${OUT}" | tee "${OUT}.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aqua-daemon-*.tar.gz
            aqua-daemon-*.tar.gz.sha256
